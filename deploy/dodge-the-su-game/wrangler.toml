name = "dodge-the-su-game"
main = "gate-worker.js"
compatibility_date = "2024-11-01"

# Serves the game as a static asset, but ONLY after gate-worker.js has
# checked for the shared-password cookie - unlike the other three games
# on this site, this one is not meant to be public (see ../../dodge-the-su/GATE.md).
# The GitHub Actions workflow (.github/workflows/deploy-dodge-the-su-game.yml)
# copies dodge-the-su/index.html and dodge-the-su/assets/ into ./public
# before running `wrangler deploy`, so that folder is CI-generated and not
# committed itself - gate-worker.js, however, IS committed (it's this
# Worker's actual entry point, not a build output).
[assets]
directory = "./public"
binding = "ASSETS"
# Without this, Cloudflare serves any request matching a file in the
# static bundle straight from its edge - which is everything here ("/" ->
# index.html, every path under assets/img and assets/audio) - WITHOUT
# ever invoking gate-worker.js's fetch handler. That's not a bypass in
# the password check itself; the check just never runs. run_worker_first
# unconditionally routes every request through the Worker first, so the
# gate actually sits in front of the whole site as intended. Confirmed
# live: without this, an unauthenticated request to a real asset path
# (e.g. assets/img/9_sprite_police.png) returned 200 with the actual
# file, not gate-worker.js's 503/401.
run_worker_first = true

# Custom domain is attached to this Worker via the Cloudflare dashboard
# (Workers & Pages -> dodge-the-su-game -> Settings -> Domains & Routes) -
# see dodge-the-su/backend/README.md for that step, and dodge-the-su/GATE.md
# for the one-time GATE_PASSWORD secret this Worker requires before it'll
# serve anything.
