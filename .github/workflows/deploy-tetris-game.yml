name: Deploy Tetris to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'deploy/tetris-game/**'
      - '.github/workflows/deploy-tetris-game.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the static site
        run: |
          mkdir -p deploy/tetris-game/public
          cp index.html deploy/tetris-game/public/index.html

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: deploy/tetris-game
          command: deploy
