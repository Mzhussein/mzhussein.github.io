name: Deploy Asteroids to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'asteroids/index.html'
      - 'deploy/asteroids-game/**'
      - '.github/workflows/deploy-asteroids-game.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the static site
        run: |
          mkdir -p deploy/asteroids-game/public
          cp asteroids/index.html deploy/asteroids-game/public/index.html

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: deploy/asteroids-game
          command: deploy
